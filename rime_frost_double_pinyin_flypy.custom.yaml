patch:
  schema/dependencies:
    - melt_eng

  switches:
    - name: ascii_mode
      reset: 0
      states: [ 中文, 英文 ]
    - name: traditionalization
      states: [ 简体, 繁体 ]
    - name: full_shape
      states: [ 半角, 全角 ]
    - name: ascii_punct
      states: [ 。，, ．， ]
    - name: emoji
      reset: 1
      states: [ 无表情, 表情 ]

  engine/processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  engine/segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  engine/translators:
    - punct_translator
    - script_translator
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - table_translator@personal_en
    - lua_translator@*force_gc
  engine/filters:
    - lua_filter@*autocap_filter
    - lua_filter@*reduce_english_filter
    - simplifier@emoji
    - simplifier@traditionalize
    - uniquifier

  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  speller/initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  recognizer/patterns:
    url_2: "^[A-Za-z]+[.].*$"

  personal_en:
    dictionary: ""
    user_dict: personal_en
    db_class: userdb
    enable_sentence: false
    enable_completion: false
    initial_quality: 1

  translator/spelling_hints: 0
  translator/always_show_comments: false
  translator/preedit_format: []
  translator/comment_format: []
  translator/contextual_suggestions: true
  translator/max_homophones: 4

  grammar:
    __include: mac_grammar:/grammar?
