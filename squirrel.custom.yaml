# Based on rime-macos27-theme by OothMCcc and 安静 (qvshuo), MIT License:
# https://github.com/OothMCcc/rime-macos27-theme
patch:
  style:
    status_message_type: mix
    candidate_format: "[label]\u2004[candidate]\u2002"
    candidate_list_layout: linear
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    translucency: true
    mutual_exclusive: false
    memorize_size: false
    show_paging: false
    alpha: 0.92
    corner_radius: 9.8
    hilited_corner_radius: 8.3
    surrounding_extra_expansion: -3.05
    border_height: -6.9
    border_width: -2.8
    line_spacing: 0
    spacing: 5
    base_offset: 0
    shadow_size: 0
    font_face: PingFang SC
    font_point: 15.5
    label_font_face: PingFang SC
    label_font_point: 10
    color_scheme: macos_light
    color_scheme_dark: macos_dark

  app_options: {}

  preset_color_schemes:
    macos_light:
      color_space: display_p3
      back_color: "0xCCFFFFFF"
      hilited_candidate_back_color: "0xFF7A00"
      text_color: "0xFFFFFF"
      candidate_text_color: "0x000000"
      hilited_candidate_text_color: "0xFFFFFF"
      label_color: "0x99000000"
      hilited_candidate_label_color: "0xFFFFFF"

    macos_dark:
      color_space: display_p3
      back_color: "0x26000000"
      hilited_candidate_back_color: "0xFF840A"
      text_color: "0xFFFFFF"
      candidate_text_color: "0xE6FFFFFF"
      hilited_candidate_text_color: "0xFFFFFF"
      label_color: "0x80FFFFFF"
      hilited_candidate_label_color: "0xFFFFFF"
